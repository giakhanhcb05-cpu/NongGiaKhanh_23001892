<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bài 3 - Giỏ hàng</title>
  <script src="https://unpkg.com/vue@3.4.21/dist/vue.global.prod.js"></script>
  <style>
    body { font-family: Arial, sans-serif; background: #f0f2f5; display: flex; justify-content: center; padding: 30px; }
    .box { background: #fff; width: 560px; border-radius: 12px; padding: 24px; box-shadow: 0 4px 12px rgba(0,0,0,.15); }
    .row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid #eee; }
    .name { flex: 1; }
    .total { width: 110px; text-align: right; }
    button { padding: 5px 10px; border: 0; border-radius: 6px; cursor: pointer; background: #1e6fd9; color: #fff; }
    button.del { background: #d62828; }
    .empty { text-align: center; color: #888; padding: 20px; }
    .err { color: #d62828; font-size: 13px; }
    .sum { margin-top: 12px; font-weight: bold; }
  </style>
</head>
<body>
  <div id="app" class="box">
    <h2>Giỏ hàng</h2>

    <dong-gio-hang v-for="item in cart" :key="item.id"
      :id="item.id" :ten="item.ten" :gia="item.gia" :soluong="item.soluong"
      @doi-so-luong="changeQuantity" @yeu-cau-xoa="removeItem">
    </dong-gio-hang>

    <div class="empty" v-if="cart.length === 0">Giỏ hàng trống</div>
    <div class="err" v-if="error">{{ error }}</div>

    <div class="sum">
      <div>Tổng số lượng: {{ totalQuantity }}</div>
      <div>Tổng tiền: {{ totalMoney.toLocaleString() }} đồng</div>
    </div>
  </div>

  <script>
    const { createApp } = Vue;

    // component con
    const DongGioHang = {
      props: ['id', 'ten', 'gia', 'soluong'],
      emits: ['doi-so-luong', 'yeu-cau-xoa'],
      computed: {
        thanhTien() {
          return this.gia * this.soluong;
        }
      },
      template: `
        <div class="row">
          <span class="name">{{ ten }} ({{ gia.toLocaleString() }} đ)</span>
          <button @click="$emit('doi-so-luong', id, soluong - 1)">-</button>
          <span>{{ soluong }}</span>
          <button @click="$emit('doi-so-luong', id, soluong + 1)">+</button>
          <span class="total">{{ thanhTien.toLocaleString() }} đ</span>
          <button class="del" @click="$emit('yeu-cau-xoa', id)">Xóa</button>
        </div>
      `
    };

    const app = createApp({
      data() {
        return {
          cart: [
            { id: 1, ten: 'Bút', gia: 5000, soluong: 2 },
            { id: 2, ten: 'Vở', gia: 12000, soluong: 3 }
          ],
          error: ''
        };
      },
      computed: {
        totalQuantity() {
          let sum = 0;
          for (const item of this.cart) {
            sum += item.soluong;
          }
          return sum;
        },
        totalMoney() {
          let sum = 0;
          for (const item of this.cart) {
            sum += item.gia * item.soluong;
          }
          return sum;
        }
      },
      methods: {
        changeQuantity(id, soluong) {
          // kiểm tra số lượng là số nguyên từ 1 đến 99
          if (!Number.isInteger(soluong) || soluong < 1 || soluong > 99) {
            this.error = 'Số lượng phải là số nguyên từ 1 đến 99';
            return;
          }
          this.error = '';
          const item = this.cart.find(i => i.id === id);
          if (item) {
            item.soluong = soluong;
          }
        },
        removeItem(id) {
          this.error = '';
          this.cart = this.cart.filter(i => i.id !== id);
        }
      }
    });

    app.component('dong-gio-hang', DongGioHang);
    app.mount('#app');
  </script>
</body>
</html>
