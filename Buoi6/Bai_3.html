<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bài 3 - Quản lý công việc cá nhân</title>
  <script src="https://unpkg.com/vue@3.4.21/dist/vue.global.prod.js"></script>
  <style>
    body { font-family: Arial, sans-serif; background: #f0f2f5; display: flex; justify-content: center; padding: 30px; }
    .box { background: #fff; width: 480px; border-radius: 12px; padding: 24px; box-shadow: 0 4px 12px rgba(0,0,0,.15); }
    .add { display: flex; gap: 8px; }
    .add input { flex: 1; padding: 8px; }
    button { padding: 7px 12px; border: 0; border-radius: 6px; cursor: pointer; background: #1e6fd9; color: #fff; }
    button.del { background: #d62828; }
    button.active { background: #0b3d91; }
    button.gray { background: #777; }
    .filters { margin: 14px 0; display: flex; gap: 6px; }
    ul { list-style: none; padding: 0; }
    li { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid #eee; }
    li span { flex: 1; }
    li.done span { text-decoration: line-through; color: #999; }
    .empty { text-align: center; color: #888; padding: 16px; }
    .err { color: #d62828; font-size: 13px; margin-top: 4px; }
    .stats { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; font-size: 14px; }
  </style>
</head>
<body>
  <div id="app" class="box">
    <h2>Công việc trong ngày</h2>
    <div class="add">
      <input type="text" v-model="newTask" @keyup.enter="addTask" placeholder="Nhập tên công việc...">
      <button @click="addTask">Thêm</button>
    </div>
    <div class="err" v-if="error">{{ error }}</div>

    <div class="filters">
      <button v-for="f in filters" :key="f.key" :class="{ active: filter === f.key }" @click="filter = f.key">
        {{ f.label }}
      </button>
    </div>

    <ul v-if="filteredTasks.length">
      <li v-for="task in filteredTasks" :key="task.id" :class="{ done: task.done }">
        <input type="checkbox" v-model="task.done">
        <span>{{ task.title }}</span>
        <button class="del" @click="removeTask(task.id)">Xóa</button>
      </li>
    </ul>
    <div class="empty" v-else>{{ emptyMessage }}</div>

    <div class="stats">
      <span>Tổng: {{ total }} việc | Chưa hoàn thành: {{ remaining }}</span>
      <button class="gray" @click="clearDone" :disabled="remaining === total">Xóa các việc đã hoàn thành</button>
    </div>
  </div>

  <script>
    const { createApp } = Vue;
    createApp({
      data() {
        return {
          tasks: [
            { id: 1, title: 'Học Vue.js', done: false },
            { id: 2, title: 'Làm bài tập buổi 6', done: false }
          ],
          nextId: 3,
          newTask: '',
          error: '',
          filter: 'all',
          filters: [
            { key: 'all', label: 'Tất cả' },
            { key: 'active', label: 'Chưa hoàn thành' },
            { key: 'done', label: 'Đã hoàn thành' }
          ]
        };
      },
      computed: {
        total() { return this.tasks.length; },
        remaining() { return this.tasks.filter(t => !t.done).length; },
        filteredTasks() {
          if (this.filter === 'active') return this.tasks.filter(t => !t.done);
          if (this.filter === 'done') return this.tasks.filter(t => t.done);
          return this.tasks;
        },
        emptyMessage() {
          if (this.tasks.length === 0) return 'Chưa có công việc nào. Hãy thêm công việc mới!';
          return this.filter === 'active'
            ? 'Không có công việc chưa hoàn thành.'
            : 'Chưa có công việc nào hoàn thành.';
        }
      },
      watch: {
        newTask() { this.error = ''; }
      },
      methods: {
        addTask() {
          const title = this.newTask.trim();
          if (!title) {
            this.error = 'Tên công việc không được để trống.';
            return;
          }
          this.tasks.push({ id: this.nextId++, title, done: false });
          this.newTask = '';
        },
        removeTask(id) {
          this.tasks = this.tasks.filter(t => t.id !== id);
        },
        clearDone() {
          this.tasks = this.tasks.filter(t => !t.done);
        }
      }
    }).mount('#app');
  </script>
</body>
</html>
